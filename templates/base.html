<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Job Creator{% endblock %} · ECC Solar</title>
  <style>
    :root {
      --brand: #1a6e3c;
      --brand-dark: #12522c;
      --bg: #f6f7f5;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--brand);
      color: white;
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    header a { color: white; text-decoration: none; font-weight: 600; font-size: 1.15rem; }
    header .sub { font-size: 0.85rem; opacity: 0.85; }
    main { max-width: 960px; margin: 1.5rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.55rem 0.6rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
    tr:last-child td { border-bottom: none; }
    .muted { color: var(--muted); }
    .empty { color: var(--muted); padding: 1rem 0; }
    a { color: var(--brand); }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .toolbar h1 { margin: 0; }
    .btn {
      display: inline-block;
      background: var(--brand);
      color: white !important;
      text-decoration: none;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: var(--brand-dark); }
    .btn-secondary { background: transparent; color: var(--brand) !important; border: 1px solid var(--brand); }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.9rem;
    }
    .field { display: flex; flex-direction: column; gap: 0.25rem; }
    .field.wide { grid-column: 1 / -1; }
    label { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
    input, textarea, select {
      font: inherit;
      padding: 0.5rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
    }
    input:focus, textarea:focus, select:focus { outline: 2px solid var(--brand); border-color: var(--brand); }
    .actions { margin-top: 1.1rem; display: flex; gap: 0.6rem; }
    .flash {
      border-radius: 8px;
      padding: 0.7rem 1rem;
      margin-bottom: 1rem;
      background: #e7f4ec;
      border: 1px solid #bfe3cd;
      color: #14532d;
    }
    .flash.error { background: #fdecec; border-color: #f5c2c2; color: #7f1d1d; }
    dl.profile { display: grid; grid-template-columns: 180px 1fr; gap: 0.45rem 1rem; margin: 0; }
    dl.profile dt { color: var(--muted); font-size: 0.85rem; }
    dl.profile dd { margin: 0; }
    fieldset.section {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem 1rem 1rem;
      margin: 0;
      background: #fafbf9;
    }
    fieldset.section legend {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--brand-dark);
      padding: 0 0.4rem;
    }
    .check-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.4rem; }
    label.check { font-weight: normal; font-size: 0.95rem; color: var(--text); display: flex; align-items: center; gap: 0.45rem; }
    label.check input { width: auto; }
    .badge {
      display: inline-block;
      background: #e7f4ec;
      border: 1px solid #bfe3cd;
      color: #14532d;
      border-radius: 999px;
      padding: 0.15rem 0.65rem;
      font-size: 0.8rem;
      font-weight: 600;
      margin: 0 0.3rem 0.3rem 0;
    }
  </style>
</head>
<body>
  <header>
    <a href="/">☀️ Job Creator</a>
    <span class="sub">ECC Solar internal tool</span>
    <a href="/rules" style="margin-left:auto; font-size:0.9rem; font-weight:500;">⚙️ Rules</a>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
    <footer style="margin: 2rem 0 1rem; text-align: center; color: var(--muted); font-size: 0.8rem;">
      Job Creator · running {{ version }}
    </footer>
  </main>
</body>
</html>
