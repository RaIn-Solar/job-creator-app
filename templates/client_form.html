{% extends "base.html" %}
{% block title %}New client{% endblock %}
{% block content %}
<h1>Create a client profile</h1>
<form method="post" class="card">
  <div class="form-grid">
    <div class="field wide">
      <label for="name">Client name *</label>
      <input id="name" name="name" value="{{ values.get('name', '') }}" required>
    </div>
    <div class="field">
      <label for="phone">Phone number *</label>
      <input id="phone" name="phone" value="{{ values.get('phone', '') }}" required>
    </div>
    <div class="field">
      <label for="email">Email address (optional)</label>
      <input id="email" name="email" type="email" value="{{ values.get('email', '') }}">
    </div>
    <fieldset class="section wide" style="grid-column: 1 / -1;">
      <legend>📍 Street address — where the client lives / the job site</legend>
      <div class="field">
        <label for="street_address">Street address *</label>
        <input id="street_address" name="street_address"
               placeholder="123 Main St, Dallas, TX 75201"
               value="{{ values.get('street_address', '') }}" required>
      </div>
    </fieldset>
    <fieldset class="section wide" style="grid-column: 1 / -1;">
      <legend>💳 Billing address — where invoices go</legend>
      <label style="font-weight:normal; display:flex; align-items:center; gap:0.35rem; margin-bottom:0.5rem;">
        <input type="checkbox" id="same_as_street" style="width:auto;">
        Same as street address
      </label>
      <div class="field">
        <label for="billing_address">Billing address *</label>
        <input id="billing_address" name="billing_address"
               placeholder="PO Box, mailing address, or same as street"
               value="{{ values.get('billing_address', '') }}" required>
      </div>
    </fieldset>
    <div class="field wide">
      <label for="referral_source">Referral source (optional)</label>
      <input id="referral_source" name="referral_source"
             placeholder="Google, door hanger, referred by the Smith install…"
             value="{{ values.get('referral_source', '') }}">
    </div>
    <div class="field wide">
      <label for="notes">Notes (gate codes, pets, preferences…)</label>
      <textarea id="notes" name="notes" rows="3">{{ values.get('notes', '') }}</textarea>
    </div>
  </div>
  <div class="actions">
    <button type="submit" class="btn">Create client</button>
    <a href="{{ url_for('home') }}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
<script>
  // "Same as street address": mirror the street address into billing while checked.
  const street = document.getElementById("street_address");
  const billing = document.getElementById("billing_address");
  const same = document.getElementById("same_as_street");
  function syncBilling() {
    if (same.checked) {
      billing.value = street.value;
      billing.readOnly = true;
    } else {
      billing.readOnly = false;
    }
  }
  same.addEventListener("change", syncBilling);
  street.addEventListener("input", syncBilling);
</script>
{% endblock %}
